targets:
  $default:
    sources:
      exclude:
        - lib/builders

builders:
  register_store_adapters:
    import: "package:prophecy_compagnon_shared/builders/store_adapters_builder.dart"
    builder_factories: ["registerStoreAdaptersBuilder"]
    build_extensions: {"lib/$lib$": ["lib/classes/storage/register_store_adapters.dart"]}
    auto_apply: root_package
    build_to: source
  register_entity_effects:
    import: "package:prophecy_compagnon_shared/builders/entity_effects_builder.dart"
    builder_factories: ["registerEntityEffectsBuilder"]
    build_extensions: {"lib/$lib$": ["lib/classes/session/register_entity_effects.dart"]}
    auto_apply: root_package
    build_to: source
  register_combat_actions:
    import: "package:prophecy_compagnon_shared/builders/combat_actions_builder.dart"
    builder_factories: ["registerCombatActionsBuilder"]
    build_extensions: {"lib/$lib$": ["lib/classes/session/encounter/register_combat_actions.dart"]}
    auto_apply: root_package
    build_to: source
  register_session_board_items:
    import: "package:prophecy_compagnon_shared/builders/session_board_items_builder.dart"
    builder_factories: ["registerSessionBoardItemsBuilder"]
    build_extensions: {"lib/$lib$": ["lib/classes/session/board/register_board_items.dart"]}
    auto_apply: root_package
    build_to: source
  register_session_map_items:
    import: "package:prophecy_compagnon_shared/builders/session_map_items_builder.dart"
    builder_factories: ["registerSessionMapItemsBuilder"]
    build_extensions: {"lib/$lib$": ["lib/classes/session/map/register_map_items.dart"]}
    auto_apply: root_package
    build_to: source